# Example: add this service alongside your existing Wealthfolio compose file.
#
# Image: ghcr.io/bubbles840/wealthfolio-simplefin-sync:latest
# Or build locally:
#   docker build -f companion/Dockerfile -t simplefin-sync:local .
#
# Usage:
#   1. Set WEALTHFOLIO_API_URL and WEALTHFOLIO_PASSWORD (or WEALTHFOLIO_PASSWORD_FILE).
#   2. The SimpleFin access credentials and account mappings are managed directly
#      in Wealthfolio via the SimpleFin Sync addon UI.

services:
  simplefin-sync:
    image: ghcr.io/bubbles840/wealthfolio-simplefin-sync:latest
    # build:
    #   context: ./simplefin-sync
    #   dockerfile: companion/Dockerfile
    restart: unless-stopped
    environment:
      - WEALTHFOLIO_API_URL=http://wealthfolio:8088
      - WEALTHFOLIO_PASSWORD=your_wealthfolio_password
      - WEALTHFOLIO_DB_PATH=/mnt/wealthfolio.db
    volumes:
      - /mnt/data/media/budget/wealthfolio/wealthfolio.db:/mnt/wealthfolio.db:ro
    networks:
      - wealthfolio_default         # must match your Wealthfolio network name
    user: "1000:1000"

networks:
  wealthfolio_default:
    external: true
