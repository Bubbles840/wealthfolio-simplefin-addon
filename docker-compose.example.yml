# Example: add this service alongside your existing Wealthfolio compose file.
#
# Usage:
#   1. Copy simplefin-sync.env.example → simplefin-sync.env and fill in values.
#   2. Adjust `wealthfolio_default` below to match your Wealthfolio network name
#      (run `docker network ls` to find it).
#   3. docker compose -f docker-compose.yml -f docker-compose.example.yml up -d
#
# IMPORTANT: never commit simplefin-sync.env — it contains credentials.

services:
  simplefin-sync:
    image: ghcr.io/wealthfolio-community/simplefin-sync:latest
    restart: unless-stopped
    env_file: simplefin-sync.env   # generated by the addon — never commit this file
    volumes:
      # Persist sync state across container restarts so the companion doesn't
      # re-import historical transactions on every startup.
      - simplefin_sync_state:/app/state
    environment:
      STATE_FILE: /app/state/state.json
    networks:
      - wealthfolio_default         # must match your Wealthfolio network name

volumes:
  simplefin_sync_state:

networks:
  wealthfolio_default:
    external: true
