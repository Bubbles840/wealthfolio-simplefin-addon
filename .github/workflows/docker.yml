name: Publish companion image
on:
  push:
    tags: ['v*']
    # Build (without pushing) on every push to main as well: a Dockerfile or
    # dependency break used to surface only on release day, when the tag had
    # already been cut and the fix meant re-tagging.
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # QEMU + Buildx are what make the arm64 half of the build possible on an
      # x86 runner. Without them this image was amd64-only, so anyone running
      # Wealthfolio on a Raspberry Pi or an Apple-silicon host could not pull
      # it at all.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Only a tag push publishes. A main/PR build proves the image still
      # builds and stops there — no credentials, nothing overwritten.
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/wealthfolio-simplefin-sync
          # `latest` on a version tag or a manual dispatch — the two cases that
          # actually push. NOT on a main/PR build, which must never move the
          # tag every compose file in the wild pulls.
          #
          # The dispatch half is load-bearing, not cosmetic: `push` below is
          # true for a dispatch, and `type=semver` yields nothing off a branch
          # ref, so without it a manual run would push with an EMPTY tag list —
          # which build-push-action rejects outright.
          #
          # `type=semver` excludes prereleases from `latest` on its own, but
          # the raw rule below would not — so it is gated on the tag having no
          # `-suffix`. Without that, tagging `v1.16.0-rc1` to test something
          # would hand every `:latest` puller a release candidate.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')) || github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: companion/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the Actions cache, so the arm64 half (which runs
          # under emulation and is much the slower of the two) does not rebuild
          # from scratch on every run.
          cache-from: type=gha
          # `ignore-error` because a cache EXPORT failure (fork-PR cache
          # scoping, a cache-service hiccup) must not fail an otherwise-green
          # build — the cache is an optimisation, not an output.
          cache-to: type=gha,mode=max,ignore-error=true
