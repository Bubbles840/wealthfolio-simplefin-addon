name: Publish companion image
on:
  push:
    tags: ['v*']
    # Build (without pushing) on every push to main as well: a Dockerfile or
    # dependency break used to surface only on release day, when the tag had
    # already been cut and the fix meant re-tagging.
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # v1.22.0 shipped reporting itself as 1.22.0 in the tag and 1.21.0 in
      # every version string a user can see, because the suite was run before
      # the version bump and never again after it. `shared/version.test.ts`
      # would have caught it locally; nothing forced it to run. This does —
      # and it runs before the login step, so a mismatched tag publishes
      # nothing at all.
      - name: Version must match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SRC=$(node -p "require('./package.json').version")
          MAN=$(node -p "require('./manifest.json').version")
          CONST=$(grep -o "SIMPLEFIN_SYNC_VERSION = '[^']*'" shared/version.ts | cut -d"'" -f2)
          echo "tag=$TAG package=$SRC manifest=$MAN constant=$CONST"
          for got in "$SRC" "$MAN" "$CONST"; do
            if [ "$got" != "$TAG" ]; then
              echo "::error::tag v$TAG disagrees with a shipped version string ($got)"
              exit 1
            fi
          done

      - uses: docker/setup-buildx-action@v3

      # Only a tag push publishes. A main/PR build proves the image still
      # builds and stops there — no credentials, nothing overwritten.
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/wealthfolio-simplefin-sync
          # `latest` on a version tag or a manual dispatch — the two cases that
          # actually push. NOT on a main/PR build, which must never move the
          # tag every compose file in the wild pulls.
          #
          # The dispatch half is load-bearing, not cosmetic: `push` below is
          # true for a dispatch, and `type=semver` yields nothing off a branch
          # ref, so without it a manual run would push with an EMPTY tag list —
          # which build-push-action rejects outright.
          #
          # `type=semver` excludes prereleases from `latest` on its own, but
          # the raw rule below would not — so it is gated on the tag having no
          # `-suffix`. Without that, tagging `v1.16.0-rc1` to test something
          # would hand every `:latest` puller a release candidate.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')) || github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: companion/Dockerfile
          # amd64 only. arm64 was attempted here via QEMU on 2026-08-15 and
          # cannot work that way: `npm install` for the companion dies under
          # emulation with `qemu: uncaught target signal 4 (Illegal
          # instruction) - core dumped`, hanging the release build. Adding
          # arm64 means building it on a NATIVE arm64 runner (a matrix over
          # `ubuntu-24.04-arm`, pushing by digest, then merging the two into
          # one manifest) — not another emulation flag.
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the Actions cache, so the arm64 half (which runs
          # under emulation and is much the slower of the two) does not rebuild
          # from scratch on every run.
          cache-from: type=gha
          # `ignore-error` because a cache EXPORT failure (fork-PR cache
          # scoping, a cache-service hiccup) must not fail an otherwise-green
          # build — the cache is an optimisation, not an output.
          cache-to: type=gha,mode=max,ignore-error=true
